name: geocebada
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # WaPOR's Python client depends on GDAL.  On Windows it must come from
  # conda-forge so pip does not try to compile the native extension.
  - gdal
  # Enables GDAL to write the NetCDF products returned by WaPOR.
  - libgdal-netcdf
