schema_version: 1
updated: 2026-10-06

stage:
  checkpoint: "06F"
  name: selective_center_expert_abstention
  status: implemented_run_pending
  prerequisite_06e: reports/checkpoint_06e/checkpoint_06e_report.json

scope:
  active_track: competition
  hidden_fira_y_allowed: false
  incumbent: Local04D
  post_hoc_followup_to_06e: true
  purpose: >
    Test whether the 06E center residual signal becomes stable when the center
    expert is applied only to high-confidence center cases and the model
    abstains to Local04D everywhere else.
  low_tail_correction: false
  high_tail_correction: false
  hard_center_routing: true

inputs:
  base_oof_predictions: reports/checkpoint_05/base_oof_predictions.csv
  honest_pseudo_predictions: reports/checkpoint_05/pseudo_predictions.csv
  agronomic_table: data/processed/agronomic_features_v1/parcel_agronomic_features.csv
  agronomic_manifest: data/processed/agronomic_features_v1/feature_manifest.json

tails:
  low_quantile: 0.15
  high_quantile: 0.85

gate:
  low_family: water_productivity
  high_family: thermal
  logistic_c: 1.0
  rule: both_raw_tail_scores_below_cutoff
  tail_score_cutoffs: [0.40, 0.50, 0.60, 0.70, 0.80]
  note: >
    These cutoffs span approximately 21% to 62% development routing coverage
    using only the already-generated 06E X-derived gate-score distribution.
    No y-based threshold tuning was used to choose this grid.

center:
  representation: all_agronomic_pca
  ridge_alpha: 1000.0
  pca_variance: 0.80
  target: honest_local04d_residual_on_fold_valid_center_only
  rationale: >
    Freeze the strongest 06E aggregate center signal instead of reopening
    representation or alpha search.

selection:
  min_center_improvement: 0.002
  tail_tolerance_absolute: 0.003
  tail_tolerance_fraction: 0.005
  require_overall_mean_improvement: true
  require_overall_pooled_improvement: true
  require_center_improvement: true
  require_tail_protection: true
  require_fresh_confirmation_after_loso_pass: true

runtime:
  random_state: 20261006

future_confirmation:
  enabled_only_after_loso_pass: true
  score_only_incumbent_and_one_frozen_challenger: true
  note: >
    Because 06F was proposed after observing 06E, LOSO is screening evidence
    only. Promotion requires a genuinely fresh confirmation bank.

outputs:
  directory: reports/checkpoint_06f
  gate_scores: gate_scores.csv
  predictions: selective_predictions.csv
  split_metrics: selective_split_metrics.csv
  summary: selective_summary.csv
  routing_summary: routing_summary.csv
  loso_selection: loso_selection.csv
  loso_predictions: loso_predictions.csv
  loso_summary: loso_summary.json
  report_json: checkpoint_06f_report.json
  report_markdown: checkpoint_06f_report.md
