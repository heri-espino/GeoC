schema_version: 1
updated: 2026-09-18

inputs:
  feature_directory: data/processed/features_v1
  feature_table: parcel_features_all.csv
  feature_manifest: feature_manifest.json
  agronomic_directory: data/processed/agronomic_features_v1
  agronomic_table: parcel_agronomic_features.csv
  agronomic_manifest: feature_manifest.json

outputs:
  directory: data/processed/empirical_features_v1
  feature_csv: parcel_empirical_features.csv
  manifest_json: feature_manifest.json
  build_report_json: build_report.json

identity:
  id_column: ID_POLIGONO
  target_column: RENDIMIENTO_T_HA
  split_column: CONJUNTO

months: [4, 5, 6, 7, 8, 9, 10]

temporal_shape:
  metrics:
    - total_variation
    - roughness
    - curvature_energy
    - lag1_autocorr
    - linear_trend_r2
    - turning_fraction
    - peak_sharpness
    - center_of_mass_month
    - shape_entropy
  series:
    - {name: hist_s2_ndvi, prefix: sat_basic_hist_monthly__sentinel_2__ndvi_promedio__m, mode: clean}
    - {name: hist_s2_evi, prefix: sat_basic_hist_monthly__sentinel_2__evi_promedio__m, mode: clean}
    - {name: hist_s2_lai, prefix: sat_basic_hist_monthly__sentinel_2__lai_promedio__m, mode: clean}
    - {name: hist_s2_fapar, prefix: sat_basic_hist_monthly__sentinel_2__fapar_promedio__m, mode: clean}
    - {name: hist_s2_ndwi, prefix: sat_basic_hist_monthly__sentinel_2__ndwi_promedio__m, mode: clean}
    - {name: hist_s2_msi, prefix: sat_basic_hist_monthly__sentinel_2__msi_promedio__m, mode: clean}
    - {name: hist_landsat_vi6t, prefix: sat_basic_hist_monthly__landsat__vi6t_promedio__m, mode: clean}
    - {name: y2025_s2_ndvi, prefix: sat_basic_2025_monthly__sentinel_2__ndvi_promedio__m, mode: competition}
    - {name: y2025_s2_evi, prefix: sat_basic_2025_monthly__sentinel_2__evi_promedio__m, mode: competition}
    - {name: y2025_s2_lai, prefix: sat_basic_2025_monthly__sentinel_2__lai_promedio__m, mode: competition}
    - {name: y2025_s2_fapar, prefix: sat_basic_2025_monthly__sentinel_2__fapar_promedio__m, mode: competition}
    - {name: y2025_s2_ndwi, prefix: sat_basic_2025_monthly__sentinel_2__ndwi_promedio__m, mode: competition}
    - {name: y2025_s2_msi, prefix: sat_basic_2025_monthly__sentinel_2__msi_promedio__m, mode: competition}
    - {name: y2025_landsat_vi6t, prefix: sat_basic_2025_monthly__landsat__vi6t_promedio__m, mode: competition}
    - {name: y2025_planet_ndvi, prefix: sat_pro_2025_monthly__planet__ndvi_promedio__m, mode: competition}
    - {name: y2025_planet_evi, prefix: sat_pro_2025_monthly__planet__evi_promedio__m, mode: competition}
    - {name: y2025_planet_lai, prefix: sat_pro_2025_monthly__planet__lai_promedio__m, mode: competition}
    - {name: y2025_planet_msavi, prefix: sat_pro_2025_monthly__planet__msavi_promedio__m, mode: competition}

historical_range_condition:
  series:
    - name: s2_ndvi
      current_prefix: sat_basic_2025_monthly__sentinel_2__ndvi_promedio__m
      historical_min: sat_basic_hist__sentinel_2__ndvi_promedio__min
      historical_max: sat_basic_hist__sentinel_2__ndvi_promedio__max
      mode: competition
      kind: vci_like_short
      scale: 100.0
    - {name: s2_evi, current_prefix: sat_basic_2025_monthly__sentinel_2__evi_promedio__m, historical_min: sat_basic_hist__sentinel_2__evi_promedio__min, historical_max: sat_basic_hist__sentinel_2__evi_promedio__max, mode: competition, kind: histpos, scale: 1.0}
    - {name: s2_lai, current_prefix: sat_basic_2025_monthly__sentinel_2__lai_promedio__m, historical_min: sat_basic_hist__sentinel_2__lai_promedio__min, historical_max: sat_basic_hist__sentinel_2__lai_promedio__max, mode: competition, kind: histpos, scale: 1.0}
    - {name: s2_fapar, current_prefix: sat_basic_2025_monthly__sentinel_2__fapar_promedio__m, historical_min: sat_basic_hist__sentinel_2__fapar_promedio__min, historical_max: sat_basic_hist__sentinel_2__fapar_promedio__max, mode: competition, kind: histpos, scale: 1.0}
    - {name: s2_ndwi, current_prefix: sat_basic_2025_monthly__sentinel_2__ndwi_promedio__m, historical_min: sat_basic_hist__sentinel_2__ndwi_promedio__min, historical_max: sat_basic_hist__sentinel_2__ndwi_promedio__max, mode: competition, kind: histpos, scale: 1.0}
    - {name: s2_msi, current_prefix: sat_basic_2025_monthly__sentinel_2__msi_promedio__m, historical_min: sat_basic_hist__sentinel_2__msi_promedio__min, historical_max: sat_basic_hist__sentinel_2__msi_promedio__max, mode: competition, kind: histpos, scale: 1.0}
    - {name: landsat_vi6t, current_prefix: sat_basic_2025_monthly__landsat__vi6t_promedio__m, historical_min: sat_basic_hist__landsat__vi6t_promedio__min, historical_max: sat_basic_hist__landsat__vi6t_promedio__max, mode: competition, kind: histpos, scale: 1.0}

symmetric_change:
  epsilon: 1.0e-6
  pairs:
    - {name: s2_ndvi, historical_prefix: sat_basic_hist_monthly__sentinel_2__ndvi_promedio__m, current_prefix: sat_basic_2025_monthly__sentinel_2__ndvi_promedio__m, mode: competition}
    - {name: s2_evi, historical_prefix: sat_basic_hist_monthly__sentinel_2__evi_promedio__m, current_prefix: sat_basic_2025_monthly__sentinel_2__evi_promedio__m, mode: competition}
    - {name: s2_lai, historical_prefix: sat_basic_hist_monthly__sentinel_2__lai_promedio__m, current_prefix: sat_basic_2025_monthly__sentinel_2__lai_promedio__m, mode: competition}
    - {name: s2_fapar, historical_prefix: sat_basic_hist_monthly__sentinel_2__fapar_promedio__m, current_prefix: sat_basic_2025_monthly__sentinel_2__fapar_promedio__m, mode: competition}
    - {name: s2_ndwi, historical_prefix: sat_basic_hist_monthly__sentinel_2__ndwi_promedio__m, current_prefix: sat_basic_2025_monthly__sentinel_2__ndwi_promedio__m, mode: competition}
    - {name: s2_msi, historical_prefix: sat_basic_hist_monthly__sentinel_2__msi_promedio__m, current_prefix: sat_basic_2025_monthly__sentinel_2__msi_promedio__m, mode: competition}
    - {name: landsat_vi6t, historical_prefix: sat_basic_hist_monthly__landsat__vi6t_promedio__m, current_prefix: sat_basic_2025_monthly__landsat__vi6t_promedio__m, mode: competition}

sensor_shape:
  epsilon: 1.0e-6
  pairs:
    - {name: ndvi, left_prefix: sat_basic_2025_monthly__sentinel_2__ndvi_promedio__m, right_prefix: sat_pro_2025_monthly__planet__ndvi_promedio__m, mode: competition}
    - {name: evi, left_prefix: sat_basic_2025_monthly__sentinel_2__evi_promedio__m, right_prefix: sat_pro_2025_monthly__planet__evi_promedio__m, mode: competition}
    - {name: lai, left_prefix: sat_basic_2025_monthly__sentinel_2__lai_promedio__m, right_prefix: sat_pro_2025_monthly__planet__lai_promedio__m, mode: competition}

aggregate_geometry:
  epsilon: 1.0e-6
  series:
    - {name: hist_s2_ndvi, prefix: sat_basic_hist__sentinel_2__ndvi_promedio__, mode: clean}
    - {name: hist_s2_evi, prefix: sat_basic_hist__sentinel_2__evi_promedio__, mode: clean}
    - {name: hist_s2_lai, prefix: sat_basic_hist__sentinel_2__lai_promedio__, mode: clean}
    - {name: hist_s2_fapar, prefix: sat_basic_hist__sentinel_2__fapar_promedio__, mode: clean}
    - {name: hist_s2_ndwi, prefix: sat_basic_hist__sentinel_2__ndwi_promedio__, mode: clean}
    - {name: hist_s2_msi, prefix: sat_basic_hist__sentinel_2__msi_promedio__, mode: clean}
    - {name: hist_landsat_vi6t, prefix: sat_basic_hist__landsat__vi6t_promedio__, mode: clean}
    - {name: y2025_s2_ndvi, prefix: sat_basic_2025__sentinel_2__ndvi_promedio__, mode: competition}
    - {name: y2025_s2_evi, prefix: sat_basic_2025__sentinel_2__evi_promedio__, mode: competition}
    - {name: y2025_s2_lai, prefix: sat_basic_2025__sentinel_2__lai_promedio__, mode: competition}
    - {name: y2025_s2_fapar, prefix: sat_basic_2025__sentinel_2__fapar_promedio__, mode: competition}
    - {name: y2025_s2_ndwi, prefix: sat_basic_2025__sentinel_2__ndwi_promedio__, mode: competition}
    - {name: y2025_s2_msi, prefix: sat_basic_2025__sentinel_2__msi_promedio__, mode: competition}
    - {name: y2025_landsat_vi6t, prefix: sat_basic_2025__landsat__vi6t_promedio__, mode: competition}
    - {name: y2025_planet_ndvi, prefix: sat_pro_2025__planet__ndvi_promedio__, mode: competition}
    - {name: y2025_planet_evi, prefix: sat_pro_2025__planet__evi_promedio__, mode: competition}
    - {name: y2025_planet_lai, prefix: sat_pro_2025__planet__lai_promedio__, mode: competition}
    - {name: y2025_planet_msavi, prefix: sat_pro_2025__planet__msavi_promedio__, mode: competition}

supervised_discovery:
  note: target-aware discovery is fold-local and never materialized globally.
  top_primitives: 12
  top_expressions: 20
  epsilon: 1.0e-6
  operations: [product, difference, sum, safe_ratio, symmetric_change]
  primitive_columns:
    - siap_hist__yield_mean_recent
    - siap_hist__yield_trend_recent
    - soilgrids__soc__depth_weighted_0_30cm
    - soilgrids__nitrogen__depth_weighted_0_30cm
    - soilgrids__cec__depth_weighted_0_30cm
    - soilgrids__clay__depth_weighted_0_30cm
    - clim_official_2025__prec__season_sum
    - wapor_2025__aeti__season_total
    - wapor_2025__npp__season_total
    - sat_basic_2025__sentinel_2__ndvi_promedio__mean
    - sat_basic_2025__sentinel_2__evi_promedio__mean
    - sat_pro_2025__planet__ndvi_promedio__mean
    - agro_anomaly__s2_ndvi__season_mean_delta
    - agro_anomaly__s2_evi__season_mean_delta
    - agro_pheno__y2025_s2_ndvi__auc
    - agro_pheno__y2025_s2_lai__auc
    - agro_water__2025__npp_per_aeti_season
    - agro_water__2025__precip_minus_aeti_season
    - agro_thermal__2025__gdd_proxy_base5p0c
    - agro_soil__soc_x_cec
    - emp_vci_like_short__s2_ndvi__season_mean
    - emp_shape__y2025_s2_ndvi__shape_entropy
    - emp_symchange__s2_ndvi__season_mean
    - emp_sensor_shape__s2_vs_planet__ndvi__pearson_r

validation:
  expected_rows: 197
  require_unique_id: true
  drop_all_null: true
  drop_constant: true
