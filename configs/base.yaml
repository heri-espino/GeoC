project:
  name: GeoCebada
  random_seed: 42

paths:
  source: data/source
  raw: data/raw
  interim: data/interim
  processed: data/processed
  models: models
  reports: reports

data_contract:
  id_column: ID_POLIGONO
  target_column: RENDIMIENTO_T_HA
  split_column: CONJUNTO
  train_value: ENTRENAMIENTO
  prediction_value: PREDICCION
  expected_total_parcels: 197
  expected_train_parcels: 138
  expected_prediction_parcels: 59

validation:
  # Do not choose the final strategy until parcel geography and the operational
  # prediction horizon are audited. Random CV must be compared with a
  # spatial/grouped diagnostic.
  strategy: null
  n_splits: null

metrics:
  - rmse
  - mae
  - r2

temporal:
  climate_start: 2022-01
  climate_end: 2025-12
  # Confirmed by the official dataset description: the yield target belongs to
  # the April-October 2025 production cycle.
  target_cycle_start: 2025-04
  target_cycle_end: 2025-10
  # Still unresolved: the exact date/window at which the operational forecast
  # is meant to be made. Final predictors must not use observations after it.
  prediction_cutoff: null

geospatial:
  precipitation_crs: EPSG:4326
  temperature_crs: EPSG:4326
  topography_crs: EPSG:6372
  parcel_crs: null  # inspect directly from delivered parcel source before use
