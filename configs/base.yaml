project:
  name: GeoCebada
  random_seed: 42

objective:
  mode: transductive_fixed_target_reconstruction
  active_track: competition
  allow_all_197_covariates: true
  hidden_prediction_targets: forbidden

paths:
  source: data/source
  raw: data/raw
  interim: data/interim
  processed: data/processed
  models: models
  reports: reports

data_contract:
  id_column: ID_POLIGONO
  target_column: RENDIMIENTO_T_HA
  split_column: CONJUNTO
  train_value: ENTRENAMIENTO
  prediction_value: PREDICCION
  expected_total_parcels: 197
  expected_train_parcels: 138
  expected_prediction_parcels: 59

validation:
  # Active Checkpoint 04 validation hides pseudo-target y while keeping pseudo-target X visible
  # to X-only transductive steps. Legacy state/municipality folds remain stress tests.
  strategy: transductive_pseudo_competition
  expose_pseudo_target_x: true
  repeated: true
  target_matched: true

metrics:
  - rmse
  - mae
  - r2

temporal:
  climate_start: 2022-01
  climate_end: 2025-12
  # Confirmed by the official dataset description: the yield target belongs to
  # the April-October 2025 production cycle.
  target_cycle_start: 2025-04
  target_cycle_end: 2025-10
  # Active competition reconstruction may use the full observed 2025 competition track.
  # A strict prospective cutoff is not the active Checkpoint 04 objective.
  prediction_cutoff: null

geospatial:
  precipitation_crs: EPSG:4326
  temperature_crs: EPSG:4326
  topography_crs: EPSG:6372
  parcel_crs: EPSG:4326  # directly inspected from the delivered parcel archive
