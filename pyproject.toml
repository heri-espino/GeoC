[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geocebada"
version = "0.1.0"
description = "GeoCebada: reconstruccion transductiva de 59 rendimientos de cebada para AgroCebada FIRA 2026"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "matplotlib>=3.9",
  "plotly>=6.0",
  "statsmodels>=0.14",
  "pyyaml>=6.0",
  "joblib>=1.4",
  "streamlit>=1.38",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "jupyterlab>=4.2",
]
models = [
  "xgboost>=2.1",
  "lightgbm>=4.5",
  "catboost>=1.2",
  "shap>=0.46",
  "optuna>=4.0",
]
geo = [
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "rasterio>=1.4",
]
external = [
  "requests>=2.31",
  "cdsapi>=0.7",
  "wapordl>=1.2",
  "xarray>=2024.7",
  "h5netcdf>=1.3",
  "h5py>=3.11",
  "openpyxl>=3.1",
]
gpu = [
  "cupy-cuda12x>=13.0",
]
docs = [
  "sphinx>=8.0",
  "furo>=2024.8",
  "myst-parser>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
