schema_version: 1
updated: 2026-09-19

scope:
  active_track: competition
  source_checkpoint: 03C.2
  policy: >
    Evaluate leakage-safe stacked generalization using only labeled training
    parcels. The 59 hidden-target parcels are not scored in this checkpoint.
    Outer evaluation reuses the frozen Checkpoint 02 protocols. Level-1
    features are generated by cross-fitted base learners whose hyperparameters
    are tuned only inside each cross-fit training split.

inputs:
  base_directory: data/processed/features_v1
  base_table: parcel_features_all.csv
  base_manifest: feature_manifest.json
  agronomic_directory: data/processed/agronomic_features_v1
  agronomic_table: parcel_agronomic_features.csv
  agronomic_manifest: feature_manifest.json
  empirical_directory: data/processed/empirical_features_v1
  empirical_table: parcel_empirical_features.csv
  empirical_manifest: feature_manifest.json
  empirical_config: configs/empirical_features_v1.yaml
  checkpoint03c2_config: configs/checkpoint03c2.yaml
  frozen_folds: reports/checkpoint_02/cv_folds.csv

outputs:
  directory: reports/checkpoint_03c4
  base_outer_predictions: base_outer_predictions.csv
  meta_training_predictions: meta_training_predictions.csv
  stack_oof_predictions: stack_oof_predictions.csv
  base_search_results: base_search_results.csv
  meta_search_results: meta_search_results.csv
  outer_fold_metrics: outer_fold_metrics.csv
  protocol_summary: protocol_summary.csv
  robustness_summary: robustness_summary.csv
  stack_coefficients: stack_coefficients.csv
  run_report_json: checkpoint_03c4_report.json
  run_report_markdown: checkpoint_03c4_report.md

identity:
  id_column: ID_POLIGONO
  target_column: RENDIMIENTO_T_HA
  split_column: CONJUNTO
  train_value: ENTRENAMIENTO
  state_column: meta_estado
  municipality_column: meta_municipio

validation:
  outer_protocols:
    - fold_state_stratified
    - fold_municipality_grouped
  outer_folds: 5
  level1_folds: 3
  base_tuning_folds: 2
  outer_refit_tuning_folds: 3
  meta_tuning_folds: 3
  random_state: 42
  note: >
    Outer validation remains untouched. Within each outer training split,
    level-1 OOF predictions use 3-fold cross-fitting. Every base learner inside
    a level-1 fold tunes hyperparameters using a separate 2-fold split of only
    that level-1 training subset. Final base predictions for the outer
    validation fold tune on the full outer training subset using 3-fold CV.

base_candidates:
  B01_C0_PLS:
    representation: C0_base
    model: PLS
    source: checkpoint03c2
  B02_C3_Ridge:
    representation: C3_base_agro_plus_discovery
    model: Ridge
    source: checkpoint03c2
  B03_C1_CatBoost:
    representation: C1_agronomic
    model: CatBoost
    source: checkpoint03c2
  B04_C0_Ridge:
    representation: C0_base
    model: Ridge
    source: checkpoint03c2
  B05_C3_PLS:
    representation: C3_base_agro_plus_discovery
    model: PLS
    source: checkpoint03c2
  B06_C2_PLS:
    representation: C2_all_plus_discovery
    model: PLS
    source: checkpoint03c2
  B07_C1_ExtraTrees:
    representation: C1_agronomic
    model: ExtraTrees
    source: checkpoint03c2
  B08_C1_PLS:
    representation: C1_agronomic
    model: PLS
    source: checkpoint03c2
  B09_C0_PCA_Ridge:
    representation: C0_base
    model: PCA_Ridge
    source: checkpoint03c4
  B10_C1_PCA_Ridge:
    representation: C1_agronomic
    model: PCA_Ridge
    source: checkpoint03c4

custom_base_models:
  PCA_Ridge:
    kind: pca_ridge
    candidates:
      - {variance: 0.80, alpha: 10.0}
      - {variance: 0.80, alpha: 100.0}
      - {variance: 0.80, alpha: 1000.0}
      - {variance: 0.90, alpha: 10.0}
      - {variance: 0.90, alpha: 100.0}
      - {variance: 0.90, alpha: 1000.0}
      - {variance: 0.95, alpha: 10.0}
      - {variance: 0.95, alpha: 100.0}
      - {variance: 0.95, alpha: 1000.0}

meta_features:
  include_raw_base_predictions: true
  include_mean_all: true
  include_std_all: true
  include_range_all: true
  top3:
    - B01_C0_PLS
    - B02_C3_Ridge
    - B03_C1_CatBoost
  include_top3_mean: true
  include_top3_std: true
  note: >
    Meta features use predictions only. No hidden-target information, parcel
    IDs, state labels or raw original covariates are supplied to the stacker.

meta_models:
  EqualTop3:
    kind: equal_top3

  MeanAll:
    kind: mean_all

  ConvexAll:
    kind: convex_simplex

  RidgeStack:
    kind: ridge
    candidates:
      - {alpha: 0.001}
      - {alpha: 0.01}
      - {alpha: 0.10}
      - {alpha: 1.0}
      - {alpha: 10.0}
      - {alpha: 100.0}
      - {alpha: 1000.0}

  ElasticNetStack:
    kind: elastic_net
    candidates:
      - {alpha: 0.001, l1_ratio: 0.10}
      - {alpha: 0.001, l1_ratio: 0.50}
      - {alpha: 0.001, l1_ratio: 0.90}
      - {alpha: 0.01, l1_ratio: 0.10}
      - {alpha: 0.01, l1_ratio: 0.50}
      - {alpha: 0.01, l1_ratio: 0.90}
      - {alpha: 0.10, l1_ratio: 0.10}
      - {alpha: 0.10, l1_ratio: 0.50}
      - {alpha: 0.10, l1_ratio: 0.90}

  HuberStack:
    kind: huber
    candidates:
      - {epsilon: 1.20, alpha: 0.001}
      - {epsilon: 1.20, alpha: 0.10}
      - {epsilon: 1.35, alpha: 0.001}
      - {epsilon: 1.35, alpha: 0.10}
      - {epsilon: 1.50, alpha: 0.001}
      - {epsilon: 1.50, alpha: 0.10}

  ExtraTreesStack:
    kind: extra_trees
    fixed:
      n_estimators: 600
      max_depth: null
    candidates:
      - {min_samples_leaf: 3, max_features: 0.5}
      - {min_samples_leaf: 5, max_features: 0.5}
      - {min_samples_leaf: 8, max_features: 0.5}
      - {min_samples_leaf: 3, max_features: 1.0}
      - {min_samples_leaf: 5, max_features: 1.0}
      - {min_samples_leaf: 8, max_features: 1.0}

  HistGBStack:
    kind: hist_gradient_boosting
    candidates:
      - {learning_rate: 0.03, max_leaf_nodes: 3, l2_regularization: 1.0}
      - {learning_rate: 0.03, max_leaf_nodes: 5, l2_regularization: 10.0}
      - {learning_rate: 0.05, max_leaf_nodes: 3, l2_regularization: 10.0}
      - {learning_rate: 0.05, max_leaf_nodes: 5, l2_regularization: 1.0}

runtime:
  search_n_jobs: 1
  catboost_task_type: GPU
  catboost_devices: "0"
  catboost_allow_cpu_fallback: false
  progress: true

stage:
  name: nested_stacking_oof_benchmark
  no_final_prediction: true
  purpose: >
    Test whether a leakage-safe level-1 learner can combine complementary
    predictions from robust linear, latent-factor, tree, boosted-tree and
    PCA-reduced base learners better than fixed equal-weight ensembles.
