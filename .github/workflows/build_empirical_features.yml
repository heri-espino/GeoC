name: Build empirical feature artifact

on:
  pull_request:
    paths:
      - "src/geocebada/features/empirical.py"
      - "src/geocebada/features/discovery.py"
      - "configs/empirical_features_v1.yaml"
      - "tools/build_empirical_features_v1.py"
      - "tools/run_expression_discovery_03b.py"
      - "data/processed/features_v1/**"
      - "data/processed/agronomic_features_v1/**"
      - ".github/workflows/build_empirical_features.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Build Empirical Features v1
        run: python tools/build_empirical_features_v1.py

      - name: Run fold-local expression stability audit
        run: python tools/run_expression_discovery_03b.py

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: empirical-features-v1
          path: data/processed/empirical_features_v1/
          if-no-files-found: error

      - name: Upload expression discovery audit
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-03b-expression-discovery
          path: reports/checkpoint_03b/
          if-no-files-found: error

      - name: Commit expression discovery audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/checkpoint_03b/
          if git diff --cached --quiet; then
            echo "Expression discovery report already matches the committed version."
          else
            git commit -m "Generate Checkpoint 03B expression discovery audit"
            git fetch origin "${{ github.event.pull_request.head.ref }}"
            git rebase "origin/${{ github.event.pull_request.head.ref }}"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
