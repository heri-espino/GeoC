name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev,docs,geo]"

      - name: Audit official tabular schemas
        run: python tools/audit_official_tabular.py

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: pytest -q

      - name: Checkpoint 06 preflight
        run: python tools/run_checkpoint_06.py --preflight

      - name: Validate frozen Checkpoint 06E artifacts
        run: python tools/run_checkpoint_06e.py --preflight

      - name: Checkpoint 06F preflight
        run: python tools/run_checkpoint_06f.py --preflight

      - name: Verify generated function index
        run: |
          python tools/generate_function_index.py
          git diff --exit-code -- docs/FUNCTION_INDEX.md

      - name: Validate technical report inputs
        run: python reporte/tecnico/build.py --check

      - name: Build Sphinx docs
        run: sphinx-build -W -b html docs docs/_build/html
