name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Inspect official variable reference docs
        run: python tools/inspect_reference_docx.py

      - name: Install project
        run: python -m pip install -e ".[dev,docs]"

      - name: Audit official tabular schemas
        run: python tools/audit_official_tabular.py

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: pytest -q

      - name: Verify generated function index
        run: |
          python tools/generate_function_index.py
          git diff --exit-code -- docs/FUNCTION_INDEX.md

      - name: Build Sphinx docs
        run: sphinx-build -W -b html docs docs/_build/html
