name: One-time merged branch cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prune_merged_branches_once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete only audited and merged Git branch refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_BRANCHES: '[["agent-documentation-history","c53a1339159677d29f64373cc4234fc372095783",3],["checkpoint-02-features-diagnostics","0912105a77a32225021d4e6b377b34814976f65c",1],["checkpoint-03a-agronomic-features","13dd4dfe1117e98d8d1ac3485e2e716a6f3b57bc",4],["checkpoint-03b-empirical-feature-discovery","125a3dbfc7553a6a791e1ed1013b40a577a741a5",5],["checkpoint-03c2-competition-modeling","f4931d1c4117329b7556b646b96ba7b4fac688df",8],["checkpoint-03c3-finalist-ensembles","52837031b03673cbff549499530dfc662d452896",9],["checkpoint-03c4-nested-stacking","d0510a740342d9b8ec7deb3e75eaa4aa3ab4d27d",10],["checkpoint-03c-representation-benchmark","31abe053b4a795c9767397f8f67a09516862da78",6],["docs/validation-history-07-08","1d6dcab6748a9616e8bce7149f0124c5ff2d3e5f",12],["experiment/08-nested-local-comparison","2e43ac1f0bf58cfefd578045353859eb725eb55a",11],["feat/cv-story-and-submission-onepager","480f73f3f1d445fedd491fd16f20a5614f6b0926",14],["feat/geocebada-presentation-2026","8e84710e9103d8a781b638a874d0cf4b8b94e8eb",13],["version-feature-table-v1","ff32349fd66c0cc3e5d8906f1869b376850a182d",2]]'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          branches = json.loads(os.environ["EXPECTED_BRANCHES"])
          
          def api(method, resource):
              request = urllib.request.Request(
                  "https://api.github.com/" + resource,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "GeoC-safe-merged-branch-cleanup",
                  },
                  method=method,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read()
                  return json.loads(body) if body else None
          
          repository = api("GET", f"repos/{repo}")
          if repository["default_branch"] != "main":
              raise SystemExit("ABORT: default branch changed")
          
          print("Phase 1: check ALL exact heads and merged pull requests")
          for name, expected_sha, pr_number in branches:
              ref = "repos/" + repo + "/git/ref/heads/" + urllib.parse.quote(name, safe="/")
              actual = api("GET", ref)
              if actual["object"]["sha"] != expected_sha:
                  raise SystemExit(f"ABORT: {name} moved; no branches deleted")
              pr = api("GET", f"repos/{repo}/pulls/{pr_number}")
              if not (pr["state"] == "closed" and pr["merged_at"] is not None
                      and pr["head"]["ref"] == name and pr["head"]["sha"] == expected_sha
                      and pr["base"]["ref"] == "main"):
                  raise SystemExit(f"ABORT: {name} not verifiably merged; no branches deleted")
              print("safe:", name, "PR", pr_number, expected_sha[:8])
          
          print("Phase 2: delete only verified merged refs (never main)")
          for name, expected_sha, _ in branches:
              ref_path = urllib.parse.quote(name, safe="/")
              current = api("GET", "repos/" + repo + "/git/ref/heads/" + ref_path)
              if current["object"]["sha"] != expected_sha:
                  raise SystemExit(f"STOP: {name} moved after audit, refusing deletion")
              api("DELETE", "repos/" + repo + "/git/refs/heads/" + ref_path)
              print("deleted:", name)
          print("SUCCESS: pruned", len(branches), "merged branches; main retained")
          
          PY
