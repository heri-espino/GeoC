name: Build agronomic feature artifact

on:
  pull_request:
    paths:
      - "src/geocebada/features/agronomic.py"
      - "configs/agronomic_features_v1.yaml"
      - "tools/build_agronomic_features_v1.py"
      - "data/processed/features_v1/**"
      - ".github/workflows/build_agronomic_features.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Build Agronomic Features v1
        run: python tools/build_agronomic_features_v1.py

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agronomic-features-v1
          path: data/processed/agronomic_features_v1/
          if-no-files-found: error
