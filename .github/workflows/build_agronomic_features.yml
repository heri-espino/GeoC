name: Build agronomic feature artifact

on:
  pull_request:
    paths:
      - "src/geocebada/features/agronomic.py"
      - "configs/agronomic_features_v1.yaml"
      - "tools/build_agronomic_features_v1.py"
      - "data/processed/features_v1/**"
      - ".github/workflows/build_agronomic_features.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Build Agronomic Features v1
        run: python tools/build_agronomic_features_v1.py

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agronomic-features-v1
          path: data/processed/agronomic_features_v1/
          if-no-files-found: error

      - name: Commit canonical generated artifacts
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/processed/agronomic_features_v1/parcel_agronomic_features.csv \
            data/processed/agronomic_features_v1/feature_manifest.json \
            data/processed/agronomic_features_v1/build_report.json
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild canonical Agronomic Features v1 artifacts"
            git push origin HEAD:${{ github.head_ref }}
          fi
