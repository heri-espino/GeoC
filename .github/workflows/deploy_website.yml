name: Publish GeoCebada website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "tools/sync_website_data.py"
      - ".github/workflows/deploy_website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: geoc-website-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify published CSV snapshots
        run: python3 tools/sync_website_data.py --check
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only lightweight static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
