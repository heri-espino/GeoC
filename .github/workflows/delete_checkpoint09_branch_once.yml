name: Remove merged Checkpoint 09 branch once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/delete_checkpoint09_branch_once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged and exact-checksum Checkpoint 09 branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.parse

          repo = os.environ["REPO"]
          expected = "25a0cc134f7fb151c19e52fb0052c51a3bca797b"
          branch = "experiment/09-robust-label-noise"
          token = os.environ["GH_TOKEN"]

          def request(method, url):
              req = urllib.request.Request(
                  "https://api.github.com/repos/" + repo + "/" + url,
                  method=method,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "GeoC-merged-branch-cleanup",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as result:
                  raw = result.read()
                  return json.loads(raw) if raw else None

          pr = request("GET", "pulls/15")
          if (pr["state"] != "closed" or not pr["merged_at"]
                  or pr["head"]["ref"] != branch
                  or pr["head"]["sha"] != expected
                  or pr["base"]["ref"] != "main"):
              raise SystemExit("Not safely merged; no branch deleted.")
          ref = "git/ref/heads/" + urllib.parse.quote(branch, safe="/")
          head = request("GET", ref)
          if head["object"]["sha"] != expected:
              raise SystemExit("Branch moved; no branch deleted.")
          request("DELETE", "git/refs/heads/" + urllib.parse.quote(branch, safe="/"))
          print("Deleted only merged branch: " + branch)
          PY
